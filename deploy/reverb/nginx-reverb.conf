# Websocket de Reverb por el MISMO https (443) del sitio. Va dentro del bloque
# «server { listen 443 … }» del helpdesk (lo inserta deploy/reverb/instalar.sh).
# Solo /app/ (la conexión del navegador). El servidor publica eventos directo a
# 127.0.0.1:8080, sin pasar por aquí.
location ^~ /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
